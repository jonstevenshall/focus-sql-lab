# Every morning, rebuild site/recent.json: the FOCUS_Spec issues and pull requests people discussed in the last two
# weeks, with AI summaries of what is new; then site/open-requests.json: the open issues and pull requests that concern
# each dataset and column, with a summary of each thread (Claude Haiku 5.5 at high effort; it calls the Claude API,
# which costs money). It can also be started by hand: Actions > Daily discussions > Run workflow.
name: Daily discussions

on:
  schedule:
    - cron: "30 19 * * *"  # 19:30 UTC, 05:30 in Brisbane
  workflow_dispatch:
    inputs:
      only:
        description: "Rewrite only these threads (numbers, comma-separated), to try a change; blank: whatever is due"
        type: string
        default: ""
      publish:
        description: "Push the result to main. Untick for a trial run: the result is kept for download and nothing is pushed"
        type: boolean
        default: true
      open_limit:
        description: "Most open-request summaries to write in this run (blank: 30)"
        type: string
        default: ""

permissions:
  contents: write

concurrency: refresh  # shared with "Refresh from FOCUS_Spec", so the two never push at the same time

jobs:
  recent:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The latest main, not the commit the run was queued on: a run that waited behind another must build on
      # what that one pushed, or the two clash on site/update-log.json.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install anthropic

      - name: Summarise the last two weeks
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ONLY: ${{ inputs.only }}
        run: |
          args=(--write --model claude-haiku-5-5 --effort high)
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          python -I tools/recent.py site "${args[@]}"

      # If this step fails, the Recent tab above is still published, and the open requests keep yesterday's file.
      - name: Match open requests to the data model and summarise them
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMIT: ${{ inputs.open_limit }}
        run: |
          args=(--write --model claude-haiku-5-5 --effort high)
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          python -I tools/open_requests.py site "${args[@]}"

      - name: Keep the result (trial run)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: trial-run
          path: |
            site/recent.json
            site/open-requests.json
            site/update-log.json
          retention-days: 7

      # The search box's index (site/search.json), so it finds what the steps above wrote. It reads only files in site/:
      # no network or API calls. Staged here, so the next step commits it with the rest. If it fails, the rest is still
      # published and the site keeps the previous index.
      - name: Rebuild the search index
        continue-on-error: true
        run: |
          python -I tools/build_search.py site
          git add site/search.json

      # A scheduled run has no inputs, so it always publishes.
      - name: Commit and push, if anything changed
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          git add site/recent.json site/open-requests.json site/update-log.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Recent discussion, $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
